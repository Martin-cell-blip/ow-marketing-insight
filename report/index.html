<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>守望先锋 B 站内容与玩家信号 · 研究更新（截至 2026-10-15）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 字体非阻塞加载：大陆网络下 Google Fonts 可能超时，不能卡住首屏；失败时回退系统字体 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=Saira+Condensed:ital,wght@0,600;0,700;1,600;1,700&display=swap">
<style>
/* ============ OW 设计语言：石板灰 + 能量橙，斜切平行四边形，克制 ============ */
:root{
  --bg:#12161d; --panel:#1b222d; --panel2:#202936;
  --line:#2a3442; --txt:#eef2f7; --mut:#a3afbd; --dim:#7a8a9d;
  --org:#f99e1a; --org2:#ffba4d; --cyn:#3fb6e3; --grn:#4fd08a; --red:#ef6b5b;
  --skew:-8deg;
  --chamfer:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);
  font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:15px;line-height:1.75;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3;
  background-image:url("data:image/svg+xml,%3Csvg width='56' height='100' viewBox='0 0 56 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M28 0L56 16v34L28 66 0 50V16z' fill='none' stroke='%231a212c' stroke-width='1'/%3E%3Cpath d='M28 66l28 16v18H0V82z' fill='none' stroke='%231a212c' stroke-width='1'/%3E%3C/svg%3E");}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 520px at 88% -6%,rgba(249,158,26,.06),transparent 60%);}
main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 28px 90px}
::selection{background:var(--org);color:#12161d}
a{color:var(--cyn);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cyn);outline-offset:2px}
.energy{position:fixed;top:0;left:0;right:0;height:2px;z-index:5;
  background:linear-gradient(90deg,var(--org) 0 28%,rgba(249,158,26,.25) 28% 100%)}
h1,h2,.disp{font-family:'ZCOOL QingKe HuangYou','Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:400;letter-spacing:.02em}
.num{font-family:'Saira Condensed','Noto Sans SC',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- topbar ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.topbar .brand{display:flex;align-items:center;gap:10px;color:var(--txt)}
.brand .dot{width:11px;height:12px;background:var(--org);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.topbar .meta{display:flex;flex-wrap:wrap;gap:4px 18px}
.topbar .meta b{color:var(--cyn);font-weight:600}

/* ---------- hero ---------- */
.hero{padding:64px 0 22px}
.kicker{display:inline-block;font-family:'Saira Condensed',sans-serif;font-weight:600;font-style:italic;font-size:13px;letter-spacing:.3em;color:#12161d;background:var(--org);padding:4px 16px 4px 18px;transform:skewX(var(--skew));margin-bottom:24px}
h1{font-size:clamp(32px,5.4vw,56px);line-height:1.16}
h1 .hl{color:var(--org)}
h1 .thin{color:var(--dim)}
.hero .sub{margin-top:18px;max-width:700px;color:var(--mut)}
.hero .sub b{color:var(--txt);font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:36px}
.stat{background:linear-gradient(180deg,var(--panel),var(--panel2));clip-path:var(--chamfer);padding:18px 20px 16px 22px;position:relative}
.stat::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--org)}
.stat .v{font-size:32px;line-height:1.1;font-style:italic}
.stat .v em{font-style:normal;font-size:15px;color:var(--mut);margin-left:3px;font-family:'Noto Sans SC',sans-serif}
.stat .k{font-size:12.5px;color:var(--mut);margin-top:6px}
.stat:nth-child(2) .v{color:var(--org)} .stat:nth-child(3) .v{color:var(--cyn)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;font-size:12.5px}
.toc a{color:var(--mut);text-decoration:none;border:1px solid var(--line);padding:3px 12px;transform:skewX(var(--skew))}
.toc a:hover{color:var(--org);border-color:var(--org)}

/* ---------- sections ---------- */
section{margin-top:76px;scroll-margin-top:20px}
.sechead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.sechead .no{font-family:'Saira Condensed',sans-serif;font-weight:700;font-style:italic;font-size:15px;color:#12161d;background:var(--org);padding:1px 11px;transform:skewX(var(--skew));flex:none}
h2{font-size:clamp(23px,3.4vw,29px);line-height:1.3}
h3{font-size:16.5px;line-height:1.45}
.selead{color:var(--mut);max-width:780px;margin-bottom:22px}
.selead b{color:var(--txt);font-weight:500}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));clip-path:var(--chamfer);padding:24px 26px}
.callout{display:flex;gap:12px;background:rgba(63,182,227,.06);border-left:3px solid var(--cyn);padding:12px 16px;font-size:13.5px;color:var(--mut);margin-top:14px}
.callout b{color:var(--cyn);font-weight:500}
.callout.warn{background:rgba(249,158,26,.06);border-left-color:var(--org)} .callout.warn b{color:var(--org)}
figure{margin:0}
figcaption{font-size:13.5px;color:var(--mut);margin-top:10px}
figcaption b{color:var(--txt);font-weight:500}
svg text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}
svg .oxn{font-family:'Saira Condensed',sans-serif;font-weight:600}

/* 证据强度徽章 */
.ev{display:inline-block;font-size:11px;padding:0 9px;transform:skewX(var(--skew));color:#12161d;font-weight:500;vertical-align:2px;white-space:nowrap}
.ev.fact{background:var(--cyn)} .ev.infer{background:var(--org)} .ev.hypo{background:transparent;color:var(--mut);outline:1px dashed var(--dim)}
.ev.src-off{background:var(--grn)} .ev.src-3rd{background:#8a97a8}

/* ---------- findings ---------- */
.finds{display:grid;gap:14px}
.find{background:linear-gradient(180deg,var(--panel),var(--panel2));clip-path:var(--chamfer);padding:22px 26px;position:relative}
.find .idx{font-family:'Saira Condensed',sans-serif;font-size:30px;font-weight:700;font-style:italic;color:transparent;-webkit-text-stroke:1px var(--org);line-height:1;float:left;margin:2px 16px 0 0}
.find h3{margin-bottom:10px}
.find dl{display:grid;grid-template-columns:112px 1fr;gap:6px 14px;font-size:13.5px;clear:both}
.find dt{color:var(--dim)}
.find dd{color:var(--mut)}
.find dd b{color:var(--txt);font-weight:500}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.node{position:relative;background:var(--panel);clip-path:var(--chamfer);padding:15px 15px 13px;font-size:12.5px;border-top:2px solid var(--line)}
.node .d{font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:13.5px;color:var(--cyn);letter-spacing:.04em}
.node .t{font-weight:700;font-size:13.5px;margin:4px 0 4px;line-height:1.5}
.node .s{color:var(--mut);font-size:12px;line-height:1.6}
.node .src{margin-top:8px;font-size:11px;color:var(--dim)}
.node .src a{color:var(--dim)}
.node.future{border-top-color:var(--org);background:repeating-linear-gradient(-45deg,rgba(249,158,26,.10) 0 8px,rgba(249,158,26,.03) 8px 16px),var(--panel)}
.node.future .d{color:var(--org)}
.node.future::after{content:attr(data-status);position:absolute;top:8px;right:10px;font-size:10px;color:var(--org);letter-spacing:.1em}

/* ---------- tables（容器查询：窄时变卡片） ---------- */
.tw{overflow-x:auto;container-type:inline-size}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{font-size:11.5px;color:var(--dim);text-align:left;font-weight:500;letter-spacing:.06em;padding:0 10px 9px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:10px;border-bottom:1px dashed var(--line);vertical-align:top;color:var(--mut)}
td b,td strong{color:var(--txt);font-weight:500}
tr:last-child td{border-bottom:0}
td.n{font-family:'Saira Condensed',sans-serif;font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px;color:var(--txt)}
th.n{text-align:right}
.tag{display:inline-block;font-size:10.5px;padding:0 7px;margin:2px 4px 0 0;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.of{border-color:var(--cyn);color:var(--cyn)}
@container (width < 600px){
  .tw table,.tw thead,.tw tbody,.tw tr,.tw th,.tw td{display:block}
  .tw thead{display:none}
  .tw tr{padding:10px 0;border-bottom:1px dashed var(--line)}
  .tw td{border:0;padding:3px 0;text-align:left}
  .tw td.n{text-align:left}
  .tw td[data-label]::before{content:attr(data-label) "：";content:attr(data-label) "：" / attr(data-label);color:var(--dim);font-family:'Noto Sans SC',sans-serif;font-weight:400;font-size:12px;margin-right:4px}
}

/* ---------- details ---------- */
details{margin-top:12px;font-size:13px;color:var(--mut)}
summary{cursor:pointer;color:var(--cyn);list-style:none;display:inline-flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s ease}
details[open]>summary::before{transform:rotate(45deg)}
details>.inner{margin-top:10px}

/* ---------- segments / recs / topics ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{background:linear-gradient(180deg,var(--panel),var(--panel2));clip-path:var(--chamfer);padding:22px 22px 20px;position:relative;font-size:13.5px;color:var(--mut)}
.box h3{color:var(--txt);margin-bottom:8px}
.box .lbl{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.06em;margin-top:10px}
.box p{margin-top:2px}
.box b{color:var(--txt);font-weight:500}
.box .anchor{position:absolute;top:18px;right:14px;font-size:10.5px;color:var(--org);letter-spacing:.1em;border:1px solid rgba(249,158,26,.45);padding:1px 8px;transform:skewX(var(--skew))}
.box.muted{opacity:.82;border:1px dashed var(--line);background:transparent;clip-path:none}
.metric{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.metric dl{display:grid;grid-template-columns:84px 1fr;gap:4px 12px}
.metric dt{color:var(--dim)} .metric dd b{color:var(--org2)}
ol.steps{padding-left:20px;margin-top:4px} ol.steps li{margin:3px 0}

footer{margin-top:84px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 20px;font-size:12.5px;color:var(--dim)}
footer a{color:var(--mut)}

@media(max-width:860px){
  .statgrid{grid-template-columns:1fr 1fr}
  .tl,.grid3{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:560px){
  main{padding:0 16px 70px}
  .tl,.grid3{grid-template-columns:1fr}
  .find dl,.metric dl{grid-template-columns:1fr;gap:0}
  .find dt,.metric dt{margin-top:6px}
  .card,.find,.box{padding:18px 16px}
  .stat .v{font-size:26px}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}summary::before{transition:none}}
</style>
</head>

const D = {"meta": {"title": "守望先锋 B 站内容与玩家信号 · 研究更新（截至 2026-10-15）", "h1": "《守望先锋》<span class=\"thin\">·</span> B 站内容与玩家信号<br><span class=\"hl\">研究更新</span> <span class=\"thin\">截至</span> <span class=\"hl num\">2026-10-15</span>", "sub": "在 2026-07 基线之上重新采集：<b>国服官网 7 月以来 26 条新闻 × B 站三种检索设计 × 同一视频追踪面板 × 高赞评论人工复核</b>。回答三个问题：7 月以来变了什么、玩家在意什么、哪些值得做成内容和实验。", "cutoff": "2026-10-15", "baseline_fetch": "2026-07-23 01:10", "baseline_note": "7 月原报告按当地时间记为 2026-07-22", "snapshot_fetch": "2026-10-15 12:44–13:26", "author": "马准名"}, "stats": [{"v": "4,832", "unit": "", "k": "本次检索样本中的 OW 视频（清洗后，去重）"}, {"v": "3,760", "unit": "", "k": "其中 2026-07-22 以来发布"}, {"v": "17", "unit": "条", "k": "打开原文核验的来源（官方为主）"}, {"v": "316", "unit": "条", "k": "同一视频追踪面板（随机样本命中）"}], "toc": [["find", "核心发现"], ["tl", "节点"], ["fix", "旧结论核验"], ["sample", "样本口径"], ["panel", "同一视频"], ["recent", "新发内容"], ["voice", "玩家之声"], ["seg", "人群"], ["rec", "建议与指标"], ["topics", "内容选题"], ["method", "方法与来源"]], "leads": {"find": "每条标注证据强度：事实可回到原始记录或官方原文，推断有数据支撑，也有其他可能的解释。", "timeline": "事件时间与来源发布时间分开标；斜纹卡片表示截至研究截止日仍在进行或尚未开始。", "corrections": "7 月版改动最多的是口径：把检索样本当总量、把不同发布时长的累计播放直接比较、证据没有留存原始记录。", "composition": "7 月与 10 月用同样的 5 个关键词、同样的综合排序和翻页上限各抓一次。两次清洗后各约 3,180 / 2,652 条，但同时出现在两次样本里的只有 <b>579 条</b>，两次拿到的基本是两批视频。", "panel": "把 7 月样本里固定种子抽出的 600 条视频按标题重新检索、按 bvid 精确匹配，读当前计数（与 7 月同一测量来源），找回 316 条。找回的视频 7 月播放中位 25,054，未找回的 7,789，下面的倍数反映的是能被搜到、偏热门的这部分视频。", "recent": "用按周切窗的检索（每周每词取前 3 页）取 7-22 以来的新发视频，共 2,430 条。主题按标题规则归类（可重叠）；播放只和<b>同一周发布</b>的视频比，用百分位表示，去掉发布时长的影响。", "voice": "从 7 月以来的 OW 视频里，按标题优先选玩家需求相关的视频，取匿名可见的第一页热评，共 450 条、150 个视频。关键词只做初筛，主题与立场逐条人工复核。", "segments": "人群是分析框架，按证据强弱分别写情境、阻力和传播主张，角标标出证据强度。", "priority": "指标分两套：有官方后台时用的北极星，个人只有公开数据时用的代理指标。", "topics": "优先选个人用录屏、旁白和字幕能做出来的选题。", "method": "采集参数、成败、清洗规则与全部来源都在下面；原始数据在 data/snapshots/ 与 data/raw/，可复跑。"}, "findings": [{"title": "7 月以来官方推出多项新玩家福利和教学；标题直接面向回归玩家的新视频很少", "strength": "事实", "fact": "8 月 12 日起新玩家高级战令半价（S03），10 月 7 日起注册不足 60 天的新玩家可免费领满级神话皮肤（S10）。B 站官方视频号在 8 月中下旬和 10 月 8 日至 10 日发布两批新手教学，检索样本中有 17 条，7 月基线样本里没有这类视频。同期也有对回归玩家有用的机制：第5赛季往期战令返场并继承旧进度（S09），嘉年华神话代券开放到 10 月 6 日（S07）。7 月以来的 3,760 条新视频中，标题提到回坑、回归或老玩家的有 18 条，多为皮肤调侃、怀旧和主播或职业选手回归，讲回坑后怎么接上进度的只见到一条活动奖励合集。本次采集的官网新闻里，没有一篇以回归玩家为对象。", "reading": "新玩家有专门的福利入口和教学系列；回归玩家可用的机制分散在赛季公告和活动说明里。评论中有两条自述「玩的越来越少，看的越来越多」「脱坑那么久我都爱看」，说明 B 站上有一部分离开的玩家仍在看内容。另一种可能是回归玩家看赛季预览就够用；标题检索也会漏掉没写「回坑」的相关视频。", "meaning": "往期战令进度继承、7 月以来新增的 D.Mon 和血律、黑影改为支援、已截止与仍有效的福利，可以按离开时长整理成短内容。这些事实都能在官网公告里核对，个人就能制作。", "next": "先做回坑补课选题的一条视频，看评论里的提问集中在哪一步。"}, {"title": "两次检索样本都集中在抓取前一个月；7 月版月度热度曲线不能用来判断走势", "strength": "事实", "fact": "7 月样本中 43.0% 的视频发布于抓取前 30 天内，10 月复刻抓取为 54.9%。两次清洗后的样本只有 579 条重合。同一视频追踪面板中，7 月时发布不足 30 天的视频到 10 月播放中位涨到 1.4 倍，发布超过一年的为 1.03 倍。7 月报告的 2026-07 供给峰值和三次抬升，来自单次抓取的累计播放按发布月汇总。", "reading": "两次抓取都集中在最近一个月，这与综合排序偏向新视频相符。按发布月汇总的条数和播放因此受抓取时点影响很大，较新的视频还会继续累积播放，据此看不出热度在升还是在降。近期发布量增加也可能是原因之一，两次搜索的结果分不开这两种情况。", "meaning": "做内容监测时，搜到的条数和总播放不适合当热度指标。需要比较时，固定关键词和时间窗口，只在同一周发布的视频之间比。", "next": "保留按周切窗的检索设计，每周同一时间复跑，积累可比的序列。"}, {"title": "与同一周发布的视频相比，官方号视频的播放排名高于其他账号；7 月「官方电竞号不如 UGC」的判断不再成立", "strength": "推断", "fact": "按周切窗样本中，官方视频号视频的同周播放百分位中位数为 96.0（18 条），官方电竞号为 69.1（25 条），其他账号为 49.2。按 mid 核验，官方视频号累计投稿 315 条（S17）；7 月报告写的「只发了 15 条」，是它在检索样本中出现的条数。", "reading": "7 月比较的是累计播放的平均值，容易被少数高播放视频和发布时长差异拉动。官方视频本身更容易排进搜索前三页，两个官方号的样本也小。", "meaning": "官方缺供给、缺形态的旧判断不宜再引用。官方已有新手教学和英雄预览，更值得看的是 UGC 能否把这些内容转述给回归玩家和新玩家。", "next": "取得官方号完整投稿列表后（本次被风控拒绝，F01），在全量投稿上重做同周比较。"}, {"title": "新英雄与外观类视频在同周排名较高；赛事类视频多，同周排名偏低", "strength": "推断", "fact": "按标题归类，新英雄与新赛季类占样本 3.3%，同周百分位中位 71.0；活动、福利与外观类占 4.4%，中位 66.3；赛事类占 19.2%，中位 29.1。赛事类 466 条中，338 条的标题是具体对阵、比赛日或选手第一视角。", "reading": "新英雄和外观类的高排名，与 D.Mon、血律上线和新皮肤发布在时间上重合，看不出因果。赛事类以逐场比赛视频为主，同一赛事拆成很多条，这可能是单条排名偏低的原因之一。「OWCS」是 5 个检索词之一，会抬高赛事类占比；赛事的主要观看在直播，回放播放代表不了赛事关注度。", "meaning": "版本节点前后，新英雄内容在同周排名较高，可作为选题时点的参考。个人做赛事内容，可以给不看比赛的人做入门讲解。", "next": "总决赛前，用同周百分位比较赛事讲解类和比赛视频类。"}, {"title": "10 月到 12 月集中了三个线下与赛事节点", "strength": "事实", "fact": "城市挑战者秋季赛不限段位，覆盖 22 城，城市赛 10 月 25 日至 12 月 26 日（S11）。OWCS 中国赛区第三赛段 10 月 3 日至 11 月 8 日（S15，第三方维基）。全球总决赛 12 月 2 日至 6 日在广州，12 月 4 日起在广州体育馆（S14，地方媒体与第三方维基一致，未见主办方原文）。", "reading": "这三个节点给回归玩家和赛事观众提供了具体日期和线下去处。", "meaning": "个人实验和内容发布可以围绕总决赛安排：11 月中旬前完成预热，总决赛周集中发布。", "next": "按优先建议里的小规模实验执行；主办方公告发布后更新 S14。"}], "timeline": [{"event_time": "2026-07-29 至 08-02", "title": "季中冠军赛 · 巴黎", "detail": "16 队；国服赛区第二阶段冠军 WBG 出战（官方电竞号有其小组赛回放）", "source_id": "S13", "source_type": "官方", "source_published": "2026-07-16"}, {"event_time": "2026-08-12", "title": "第4赛季：D.Mon 上线 + 战令改版", "detail": "战令改为可自选升级路线；同日新玩家高级战令半价", "source_id": "S01", "source_type": "官方", "source_published": "2026-08-11"}, {"event_time": "2026-09-09 至 10-11", "title": "璀璨系列赛 S3", "detail": "全段位免费参赛，16 强争 10 万元，可获职业队试训资格", "source_id": "S06", "source_type": "官方", "source_published": "2026-09-09"}, {"event_time": "2026-09-13 至 10-06", "title": "暴雪嘉年华：血律公布 + 全员神话代券", "detail": "完成一局即可兑换第1–14赛季任一神话礼包（已截止）", "source_id": "S07", "source_type": "官方", "source_published": "2026-09-13"}, {"event_time": "2026-09-23 起", "title": "竞逐环境治理升级", "detail": "代练双方并罚、炸鱼小号连坐；第1赛季以来禁赛 30,776 个账号（官方自报）", "source_id": "S08", "source_type": "官方", "source_published": "2026-09-23"}, {"event_time": "2026-10-07", "title": "第5赛季：血律 + 黑影转支援 + 往期战令返场", "detail": "往期战令可从当时进度继续；新玩家 60 天内领满级神话", "source_id": "S09", "source_type": "官方", "source_published": "2026-10-06"}, {"event_time": "2026-10-25 至 12-26", "title": "城市挑战者秋季赛", "detail": "不限段位，22 城，经官方小程序报名", "source_id": "S11", "future": true, "status": "未开始", "source_type": "官方", "source_published": "2026-10-09"}, {"event_time": "2026-10-03 至 11-08", "title": "OWCS 中国赛区第三赛段", "detail": "8 队，奖金池 70 万元（第三方维基）", "source_id": "S15", "future": true, "status": "进行中", "source_type": "第三方维基", "source_published": "Liquipedia 页面（检索日版本）"}, {"event_time": "2026-12-02 至 12-06", "title": "OWCS 全球总决赛 · 广州", "detail": "12-04 至 06 在广州体育馆 1 号馆", "source_id": "S14", "future": true, "status": "未开始", "source_type": "地方官方媒体 + 第三方维基", "source_published": "2026-09-24"}], "corrections" const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '–' : n >= 1e8 ? (n/1e8).toFixed(2)+' 亿' : n >= 1e4 ? (n/1e4).toFixed(1)+' 万' : n.toLocaleString('zh-CN');
const EV = {'事实':'fact','推断':'infer','待验证假设':'hypo','待验证':'hypo'};
const ev = s => `<span class="ev ${EV[s]||'hypo'}">${esc(s)}</span>`;
const srcLink = id => { const s = D.sources.find(x=>x.id===id); return s ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${id}</a>` : esc(id); };
const srcRefs = t => esc(t).replace(/\b([SF]\d{2})\b/g, m => srcLink(m));

function table(cols, rows, cls=''){
  return `<div class="tw"><table class="${cls}"><thead><tr>${cols.map(c=>`<th scope="col"${c.n?' class="n"':''}>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${cols.map((c,i)=>`<td data-label="${esc(c.h)}"${c.n?' class="n"':''}>${r[i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function sec(id, no, title, lead, body){
  return `<section id="${id}" aria-labelledby="${id}-h"><div class="sechead"><span class="no">${no}</span><h2 id="${id}-h">${title}</h2></div>${lead?`<p class="selead">${lead}</p>`:''}${body}</section>`;
}

/* 图表按容器实际宽度绘制（viewBox 1 单位 = 1px），窄屏时减少刻度、改为上下排列，保证文字可读 */
const svgOpen = (W,H,id,title,desc) => `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="${id}-t ${id}-d"><title id="${id}-t">${title}</title><desc id="${id}-d">${esc(desc)}</desc>`;

/* ---------- 图：两次检索样本按发布月份的构成 ---------- */
function compChart(W){
  const narrow=W<560, M=D.composition.by_pub_month, H=narrow?250:300, pl=narrow?34:46, pr=8, pt=18, pb=narrow?58:44;
  const iw=W-pl-pr, ih=H-pt-pb, max=Math.max(...M.flatMap(d=>[d.july,d.replica]));
  const step=iw/M.length, bw=Math.max(2,step*0.36), y=v=>pt+ih-(v/max)*ih, every=narrow?4:2;
  let s=svgOpen(W,H,'cc','两次检索样本按发布月份的视频数',D.charts.composition_desc);
  for(let g=0;g<=4;g++){const yy=pt+ih*g/4;s+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#26303e" stroke-dasharray="3 5"/><text x="${pl-6}" y="${yy+4}" fill="#7a8a9d" font-size="11" text-anchor="end" class="oxn">${Math.round(max*(4-g)/4)}</text>`;}
  M.forEach((d,i)=>{const x=pl+step*i+step/2;
    s+=`<rect x="${x-bw-0.5}" y="${y(d.july)}" width="${bw}" height="${pt+ih-y(d.july)}" fill="#5f7186"><title>${d.m} 7月样本：${d.july} 条</title></rect>`;
    s+=`<rect x="${x+0.5}" y="${y(d.replica)}" width="${bw}" height="${pt+ih-y(d.replica)}" fill="rgba(249,158,26,.85)"><title>${d.m} 10月样本：${d.replica} 条</title></rect>`;
    if(i%every===0) s+=`<text x="${x}" y="${pt+ih+16}" fill="#7a8a9d" font-size="11" text-anchor="middle" class="oxn">${d.m.slice(2).replace('-','.')}</text>`;});
  const ly=narrow?[H-28,H-8]:[H-6,H-6], lx=narrow?[pl,pl]:[pl,pl+220];
  s+=`<rect x="${lx[0]}" y="${ly[0]-9}" width="10" height="10" fill="#5f7186"/><text x="${lx[0]+16}" y="${ly[0]}" fill="#a3afbd" font-size="12">7 月样本（${D.meta.baseline_fetch.slice(0,10)} 抓取）</text>`;
  s+=`<rect x="${lx[1]}" y="${ly[1]-9}" width="10" height="10" fill="rgba(249,158,26,.85)"/><text x="${lx[1]+16}" y="${ly[1]}" fill="#a3afbd" font-size="12">10 月样本（同关键词同设计，${D.meta.cutoff} 抓取）</text></svg>`;
  return s;
}
/* ---------- 图：同一视频播放增长倍数（按 7 月时的发布时长） ---------- */
function panelChart(W){
  const narrow=W<560, B=D.panel.by_age_at_july.filter(b=>b.n), rowH=narrow?50:54, pl=narrow?84:150, pr=narrow?52:170, H=B.length*rowH+44;
  const max=Math.max(...B.map(b=>b.p75_ratio)), x=v=>pl+(v-1)/(max-1)*(W-pl-pr);
  let s=svgOpen(W,H,'pc','同一视频播放增长倍数',D.charts.panel_desc);
  s+=`<line x1="${x(1)}" y1="8" x2="${x(1)}" y2="${H-28}" stroke="#2a3442"/><text x="${x(1)}" y="${H-10}" fill="#7a8a9d" font-size="11" text-anchor="start" class="oxn">1.0×（没涨）</text>`;
  B.forEach((b,i)=>{const yy=24+i*rowH;
    s+=`<text x="${pl-10}" y="${yy+4}" fill="#eef2f7" font-size="${narrow?12:13}" text-anchor="end">${esc(b.bucket)}</text><text x="${pl-10}" y="${yy+20}" fill="#7a8a9d" font-size="11" text-anchor="end">n=${b.n}</text>`;
    s+=`<line x1="${x(b.p25_ratio)}" y1="${yy}" x2="${x(b.p75_ratio)}" y2="${yy}" stroke="rgba(63,182,227,.5)" stroke-width="10"><title>四分位 ${b.p25_ratio}×–${b.p75_ratio}×</title></line>`;
    s+=`<circle cx="${x(b.median_ratio)}" cy="${yy}" r="7" fill="#f99e1a"><title>中位 ${b.median_ratio}×</title></circle>`;
    s+=`<text x="${W-pr+10}" y="${yy+5}" fill="#f99e1a" font-size="15" class="oxn">${b.median_ratio}×</text>`;
    if(!narrow) s+=`<text x="${W-pr+56}" y="${yy+5}" fill="#7a8a9d" font-size="11">7月后新增占 ${b.median_share_after_july}%</text>`;});
  return s+`</svg>`;
}
/* ---------- 图：7 月以来新发视频的主题（份额 + 同周播放百分位） ---------- */
function themeChart(W){
  const narrow=W<560, T=[...D.recent.themes].sort((a,b)=>b.share-a.share), maxS=Math.max(...T.map(t=>t.share));
  // 宽屏：左右两栏；窄屏：每个主题两行（上行占比条，下行百分位点）
  const pl=narrow?0:140, shareW=narrow?W-70:400, rowH=narrow?66:40, top=narrow?30:40, H=T.length*rowH+top+20;
  const px0=narrow?0:pl+shareW+60, pw=narrow?W-30:W-px0-40, px=v=>px0+v/100*pw;
  let s=svgOpen(W,H,'tc','新发视频主题份额与同周播放百分位',D.charts.theme_desc);
  s+=narrow?`<text x="0" y="14" fill="#7a8a9d" font-size="11">橙条=样本占比；圆点=同周播放百分位中位（50=居中）</text>`
           :`<text x="${pl}" y="16" fill="#7a8a9d" font-size="11">样本中占比</text><text x="${px0}" y="16" fill="#7a8a9d" font-size="11">同一周发布的视频里，播放所在百分位（中位数；50=居中）</text>`;
  T.forEach((t,i)=>{const yy=top+i*rowH, w=(t.share/maxS)*(shareW-70);
    const by=narrow?yy+10:yy, dy=narrow?yy+38:yy;
    s+=narrow?`<text x="0" y="${yy}" fill="#eef2f7" font-size="13">${esc(t.theme)}</text>`:`<text x="${pl-12}" y="${yy+5}" fill="#eef2f7" font-size="13" text-anchor="end">${esc(t.theme)}</text>`;
    s+=`<rect x="${pl}" y="${by-7}" width="${Math.max(w,2)}" height="14" fill="rgba(249,158,26,.75)"><title>${esc(t.theme)}：${t.n} 条，占 ${t.share}%</title></rect><text x="${pl+Math.max(w,2)+8}" y="${by+5}" fill="#a3afbd" font-size="12" class="oxn">${t.share}%（${t.n}）</text>`;
    if(t.median_pctile_in_week!=null) s+=`<line x1="${px(0)}" y1="${dy}" x2="${px(100)}" y2="${dy}" stroke="#2f3a49"/><line x1="${px(50)}" y1="${dy-6}" x2="${px(50)}" y2="${dy+6}" stroke="#4a5868"/><circle cx="${px(t.median_pctile_in_week)}" cy="${dy}" r="6" fill="${t.median_pctile_in_week>=50?'#3fb6e3':'#5f7186'}"><title>同周百分位中位 ${t.median_pctile_in_week}</title></circle><text x="${Math.min(px(t.median_pctile_in_week)+10,W-26)}" y="${dy-8}" fill="#a3afbd" font-size="11" class="oxn">${t.median_pctile_in_week}</text>`;});
  if(!narrow) [0,50,100].forEach(v=>s+=`<text x="${px(v)}" y="${H-4}" fill="#7a8a9d" font-size="11" text-anchor="middle" class="oxn">${v}</text>`);
  return s+`</svg>`;
}
const CHARTS={comp:compChart, panel:panelChart, theme:themeChart};
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(el=>{const W=Math.floor(el.clientWidth); if(W && +el.dataset.w!==W){el.dataset.w=W; el.innerHTML=CHARTS[el.dataset.chart](W);}});}

function render(){

  document.title = m.title;
  let h=`<div class="topbar"><div class="brand"><span class="dot" aria-hidden="true"></span><span class="disp" style="font-size:15px">OW 营销洞察 · 研究更新</span></div>
  <div class="meta"><span>研究截止 <b class="num">${m.cutoff}</b>（北京时间）</span><span title="${esc(m.baseline_note)}">7 月基线采集 <b class="num">${m.baseline_fetch}</b></span><span>本次采集 <b class="num">${m.snapshot_fetch}</b></span><span>${esc(m.author)}</span></div></div>`;
  h+=`<div class="hero"><span class="kicker">RESEARCH UPDATE · ${m.cutoff}</span><h1>${m.h1}</h1><p class="sub">${m.sub}</p>
  <div class="statgrid">${D.stats.map(s=>`<div class="stat"><div class="v num">${s.v}${s.unit?`<em>${esc(s.unit)}</em>`:''}</div><div class="k">${esc(s.k)}</div></div>`).join('')}</div>

  // 01 核心发现
  h+=sec('find','01','核心发现', D.leads.find, `<div class="finds">${D.findings.map((f,i)=>`<article class="find"><div class="idx num">${String(i+1).padStart(2,'0')}</div><h3>${esc(f.title)} ${ev(f.strength)}</h3><dl>
    <dt>事实与依据</dt><dd>${srcRefs(f.fact)}</dd><dt>解释与其他可能</dt><dd>${esc(f.reading)}</dd>
    <dt>对营销的意义</dt><dd>${esc(f.meaning)}</dd><dt>下一步</dt><dd>${esc(f.next)}</dd></dl></article>`).join('')}</div>`);

  // 02 时间线
  h+=sec('tl','02','7 月以来的节点（已核验）', D.leads.timeline, `<div class="tl">${D.timeline.map(n=>`<div class="node${n.future?' future':''}"${n.future?` data-status="${esc(n.status)}"`:''}><div class="d">${esc(n.event_time)}</div><div class="t">${esc(n.title)}</div><div class="s">${esc(n.detail)}</div><div class="src">${n.source_type==='官方'?'<span class="ev src-off">官方</span>':'<span class="ev src-3rd">'+esc(n.source_type)+'</span>'} 来源发布 ${esc(n.source_published)} · ${srcLink(n.source_id)}</div></div>`).join('')}</div>`);

  // 03 旧结论核验
  h+=sec('fix','03','旧结论核验：哪些要改', D.leads.corrections, `<div class="card">${table([{h:'7 月报告的说法'},{h:'核验结果'},{h:'依据'}],
    D.corrections.map(c=>[`<b>${esc(c.old)}</b>`, `<b style="color:${c.status==='保留'?'var(--grn)':c.status==='修正'?'var(--org)':'var(--red)'}">${esc(c.status)}</b>`, esc(c.why)]))}</div>`);

  // 04 样本组成
  const C=D.composition;
  h+=sec('sample','04','检索样本不是总量：两次抓取比什么、不比什么', D.leads.composition, `<div class="card"><figure><div data-chart="comp"></div><figcaption>${D.charts.composition_caption}</figcaption></figure>
    <details><summary>查看数据</summary><div class="inner">${table([{h:'发布月份'},{h:'7 月样本',n:1},{h:'10 月样本',n:1}], C.by_pub_month.map(d=>[d.m,d.july,d.replica]))}</div></details>
    ${D.charts.composition_note ? `<div class="callout warn"><span aria-hidden="true">⚠</span><div><b>口径：</b>${esc(D.charts.composition_note)}</div></div>` : ''}</div>`);

  // 05 面板
  h+=sec('panel','05','同一视频：累计播放会一直长', D.leads.panel, `<div class="card"><figure><div data-chart="panel"></div><figcaption>${D.charts.panel_caption}</figcaption></figure>
    <details><summary>查看数据（含 7 月 TOP10 的变化）</summary><div class="inner">${table([{h:'7 月时发布时长'},{h:'样本数',n:1},{h:'中位倍数',n:1},{h:'四分位区间'},{h:'现播放中 7 月后新增占比',n:1}],
      D.panel.by_age_at_july.map(b=>[b.bucket,b.n,b.median_ratio+'×',`${b.p25_ratio}×–${b.p75_ratio}×`,b.median_share_after_july+'%']))}
      ${table([{h:'7 月 TOP10 视频'},{h:'发布'},{h:'7 月播放',n:1},{h:'现在播放',n:1},{h:'倍数',n:1}], D.panel.july_top10.map(v=>[esc(v.title),v.pub,fmt(v.play_july),fmt(v.play_now),v.ratio+'×']))}</div></details></div>`);

  // 06 新发视频
  const R=D.recent;
  h+=sec('recent','06','7 月以来新发视频在讲什么', D.leads.recent, `<div class="card"><figure><div data-chart="theme"></div><figcaption>${D.charts.theme_caption}</figcaption></figure>
    <details><summary>查看数据与示例标题</summary><div class="inner">${table([{h:'主题'},{h:'条数',n:1},{h:'占比',n:1},{h:'同周百分位中位',n:1},{h:'同周排名靠前的示例'}], R.themes.map(t=>[t.theme,t.n,t.share+'%',t.median_pctile_in_week??'–',t.examples.map(esc).join('<br>')]))}</div></details></div>
    <div class="card" style="margin-top:14px">${table([{h:'#'},{h:'标题 / UP 主'},{h:'播放',n:1},{h:'发布'},{h:'已发布天数',n:1}], R.top_videos.slice(0,10).map((v,i)=>[String(i+1).padStart(2,'0'),
      `${esc(v.title)}${v.official?'<span class="tag of">官方号</span>':''}${v.title_has_ow?'':'<span class="tag" title="标题没有 OW 字样，因标签含守望先锋而纳入">按标签纳入</span>'}<br><span style="font-size:12px;color:var(--dim)">@${esc(v.author)}</span> ${v.themes.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}`, fmt(v.play), v.pub, v.age_days]))}
      <div class="callout warn"><span aria-hidden="true">⚠</span><div><b>读法：</b>${esc(D.charts.top_note)}</div></div></div>`);

  // 07 玩家之声
  const V=D.voice;
  h+=sec('voice','07','玩家之声：高赞评论里出现了什么', D.leads.voice, `<div class="grid2">${V.themes.map(t=>`<div class="box"><h3>${esc(t.theme)} <span style="font-size:12px;color:var(--dim);font-weight:400">复核后 ${t.n} 条</span></h3><p>${esc(t.reading)}</p>
    ${t.examples.length?`<span class="lbl">评论摘录（不含用户名）</span>${t.examples.map(e=>`<p>「${esc(e.excerpt)}」<span style="color:var(--dim);font-size:12px"> · ${e.like} 赞 · ${esc(e.stance)}</span></p>`).join('')}`:''}</div>`).join('')}</div>
    <div class="callout warn"><span aria-hidden="true">⚠</span><div><b>边界：</b>${esc(V.note)}</div></div>`);

  // 08 人群框架
  h+=sec('seg','08','人群框架：只写有证据的部分', D.leads.segments, `<div class="grid2">${D.segments.map(s=>`<div class="box${s.supported?'':' muted'}"><span class="anchor">${esc(s.evidence_level)}</span><h3>${esc(s.name)}</h3>
    ${s.supported?`<span class="lbl">当前情境</span><p>${esc(s.situation)}</p><span class="lbl">具体阻力</span><p>${esc(s.friction)}</p><span class="lbl">他们现在的替代选择</span><p>${esc(s.alternative)}</p><span class="lbl">可能有效的传播主张</span><p><b>${esc(s.message)}</b></p><span class="lbl">证据</span><p>${srcRefs(s.evidence)}</p>`
    :`<p>${esc(s.why_not)}</p>`}</div>`).join('')}</div>`);

  // 09 建议与指标
  const P=D.priority;
  h+=sec('rec','09','优先营销建议与衡量方式', D.leads.priority, `<div class="box"><span class="anchor">建议 · 未验证</span><h3>${esc(P.title)}</h3><p>${esc(P.what)}</p><span class="lbl">为什么是它</span><p>${srcRefs(P.why)}</p>
    <div class="metric"><dl><dt>北极星</dt><dd><b>${esc(P.north_star.name)}</b></dd><dt>定义</dt><dd>${esc(P.north_star.definition)}</dd><dt>分母</dt><dd>${esc(P.north_star.denominator)}</dd><dt>观察窗口</dt><dd>${esc(P.north_star.window)}</dd><dt>数据取得</dt><dd>${esc(P.north_star.data)}</dd><dt>不能证明</dt><dd>${esc(P.north_star.cannot_prove)}</dd></dl></div>
    <div class="metric"><span class="lbl" style="margin-top:0">护栏</span>${P.guardrails.map(g=>`<p>· <b>${esc(g.name)}</b>：${esc(g.definition)}</p>`).join('')}</div>
    <div class="metric"><span class="lbl" style="margin-top:0">没有后台数据时的代理指标</span>${P.proxies.map(g=>`<p>· <b>${esc(g.name)}</b>：${esc(g.definition)} <span style="color:var(--dim)">不能证明：${esc(g.cannot_prove)}</span></p>`).join('')}</div></div>
    <h3 style="margin:26px 0 10px">个人可执行的小规模实验</h3>
    <div class="box"><span class="anchor">${esc(D.experiment.node)}</span><h3>${esc(D.experiment.title)}</h3>
    <span class="lbl">为什么选这个节点</span><p>${srcRefs(D.experiment.why_node)}</p>
    <span class="lbl">目标人群</span><p>${esc(D.experiment.audience)}</p><span class="lbl">核心信息</span><p><b>${esc(D.experiment.message)}</b></p>
    <span class="lbl">内容与渠道</span><p>${esc(D.experiment.content)}</p><span class="lbl">执行顺序</span><ol class="steps">${D.experiment.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <span class="lbl">观察信号</span><ol class="steps">${D.experiment.signals.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <span class="lbl">停止或调整条件</span><p>${esc(D.experiment.stop_rule)}</p></div>`);

  // 10 内容选题
  h+=sec('topics','10','三个值得实际制作的内容选题', D.leads.topics, `<div class="grid3">${D.topics.map((t,i)=>`<div class="box"><div class="num" style="font-size:28px;font-style:italic;color:transparent;-webkit-text-stroke:1px var(--org);line-height:1">${String(i+1).padStart(2,'0')}</div><h3 style="margin-top:10px">${esc(t.title)}</h3>
    <span class="lbl">给谁看</span><p>${esc(t.audience)}</p><span class="lbl">解决什么问题</span><p>${esc(t.problem)}</p><span class="lbl">开场切入</span><p><b>${esc(t.hook)}</b></p>
    <span class="lbl">需要的素材</span><p>${esc(t.materials)}</p><span class="lbl">发布渠道</span><p>${esc(t.channel)}</p><span class="lbl">为什么值得做</span><p>${srcRefs(t.why)}</p><span class="lbl">最难成立的地方</span><p>${esc(t.risk)}</p></div>`).join('')}</div>`);

  // 11 方法与来源
  h+=sec('method','11','方法、来源与限制', D.leads.method, `<div class="grid2"><div class="box"><h3>采集情况</h3>${table([{h:'来源'},{h:'状态'},{h:'说明'}], D.fetch_summary.map(f=>[esc(f.source), `<b style="color:${f.ok?'var(--grn)':'var(--red)'}">${esc(f.status)}</b>`, esc(f.detail)]))}</div>
    <div class="box"><h3>主要限制</h3>${D.limits.map(x=>`<p>· ${esc(x)}</p>`).join('')}</div></div>
    <details><summary>全部来源与证据（${D.sources.length} 条，含事件时间 / 来源发布时间 / 采集时间）</summary><div class="inner">${table([{h:'ID'},{h:'主张'},{h:'事件时间'},{h:'来源发布'},{h:'采集时间'},{h:'来源类型'}],
      D.sources.map(s=>[s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${s.id}</a>`:s.id, esc(s.claim), esc(s.event_time), esc(s.source_published), esc(s.fetched_at||'–'), esc(s.source_type)]))}</div></details>
    <details><summary>清洗规则与复跑步骤</summary><div class="inner">${D.method_notes.map(x=>`<p>· ${esc(x)}</p>`).join('')}</div></details>`);

  h+=`<footer><div>OW Marketing Insight · 个人研究项目 · 与暴雪娱乐 / 网易无隶属关系，不使用任何官方美术资产 · 历史版本：<a href="archive/2026-07-24_index.html">2026-07 基线报告</a></div><div>${esc(m.author)} · <a href="https://github.com/Martin-cell-blip">github.com/Martin-cell-blip</a></div></footer>`;
  $('#app').innerHTML = h;
}
render();
drawCharts();
